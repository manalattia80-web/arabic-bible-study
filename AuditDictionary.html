<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تدقيق قاموس سترونج بالذكاء الاصطناعي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .info-box { background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-right: 4px solid #3498db; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        button.stop { background-color: #c0392b; }
        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 5px; margin: 20px 0; height: 25px; overflow: hidden;}
        .progress-bar { width: 0%; height: 100%; background-color: #2980b9; transition: width 0.3s; }
        .log-box { width: 100%; height: 300px; background: #2c3e50; color: #ecf0f1; font-family: monospace; padding: 10px; overflow-y: auto; border-radius: 5px; box-sizing: border-box; }
        .status { font-weight: bold; margin-bottom: 10px; color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>تدقيق وتصحيح قاموس سترونج 🤖</h1>
    <div class="info-box">
        هذه الأداة تقوم بالاتصال بقاعدة البيانات الخاصة بك، واستخراج الكلمات التي لم يتم تدقيقها بعد (غير الموثقة).
        ثم ترسلها في مجموعات (10 كلمات في كل دفعة) للذكاء الاصطناعي لتصحيح النطق والمعاني اللاهوتية، وتحديثها تلقائياً.
    </div>

    <div style="text-align: center; margin-bottom: 20px;">
        <button id="startBtn" onclick="startAudit()">▶️ بدء التدقيق الشامل</button>
        <button id="stopBtn" class="stop" onclick="stopAudit()" disabled>⏹️ إيقاف مؤقت</button>
    </div>

    <div class="status" id="statusText">الحالة: جاهز للبدء...</div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div style="text-align: center; margin-bottom: 10px;" id="progressText">0 / 0</div>

    <div class="log-box" id="logBox"></div>
</div>

<script>
    const SUPABASE_URL = 'https://ojtsoqxfuwpcmwnpnabo.supabase.co/rest/v1';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qdHNvcXhmdXdwY213bnBuYWJvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzAyNzc3NiwiZXhwIjoyMTAyNjAzNzc2fQ.jZJQLfEUjropwUsYfBVUkMlWc-p343_wpD4fNTkPgbA';
    const GEMINI_API_KEY = 'AQ.Ab8RN6I0iKzZWyqCYBb4GB1xUErrZVwF7TIRmAPh7XWF5kLZeQ';
    
    let isRunning = false;
    let totalUnverified = 0;
    let processedCount = 0;

    const BATCH_SIZE = 10;
    const DELAY_MS = 15000; // 15 seconds to respect rate limits

    function log(msg) {
        const box = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString();
        box.innerHTML += `[${time}] ${msg}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    async function reqSupabase(endpoint, method = 'GET', body = null) {
        const opts = {
            method: method,
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json'
            }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(`${SUPABASE_URL}${endpoint}`, opts);
        if (method === 'GET' && res.ok) return await res.json();
        if (!res.ok) throw new Error(`Supabase Error: ${res.status}`);
        return res;
    }

    async function askGemini(entries) {
        // Construct the prompt
        let promptText = "You are a bilingual biblical lexicographer. Review these Strong's entries and fix the Arabic translation.\n\n";
        entries.forEach(e => {
            promptText += `ID: ${e.strongs_id}\n`;
            promptText += `Original Word: ${e.original_word}\n`;
            promptText += `English Definition: ${e.definition_en}\n`;
            promptText += `KJV Usage: ${e.kjv_usage}\n\n`;
        });
        promptText += `Return ONLY a valid JSON array of objects. Format:\n`;
        promptText += `[{"id": "H123", "pronunciation_ar": "accurate transliteration with tashkeel", "definition_ar": "theological meaning in Arabic", "notes_ar": "kjv usage translated to arabic"}]\n`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${GEMINI_API_KEY}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: {
                    temperature: 0.1,
                    responseMimeType: "application/json"
                }
            })
        });

        if (!response.ok) {
            const err = await response.json();
            throw new Error(`Gemini API Error: ${err.error.code} - ${err.error.message}`);
        }

        const data = await response.json();
        const textOutput = data.candidates[0].content.parts[0].text;
        return JSON.parse(textOutput);
    }

    async function startAudit() {
        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('statusText').innerText = 'الحالة: جاري التدقيق...';
        log('بدء عملية التدقيق...');

        try {
            // Count unverified
            const countRes = await fetch(`${SUPABASE_URL}/strongs_ar_translations?is_verified=eq.false&select=id`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const allUnverified = await countRes.json();
            totalUnverified = allUnverified.length;
            document.getElementById('progressText').innerText = `0 / ${totalUnverified}`;
            log(`تم العثور على ${totalUnverified} كلمة بحاجة للتدقيق.`);

            while (isRunning && totalUnverified > 0) {
                // Fetch next batch
                log(`جلب ${BATCH_SIZE} كلمات من قاعدة البيانات...`);
                // We need data from both tables, so we fetch from strongs_ar_translations and manually fetch strongs_entries
                const batchAr = await reqSupabase(`/strongs_ar_translations?is_verified=eq.false&limit=${BATCH_SIZE}`);
                
                if (batchAr.length === 0) {
                    log('تم الانتهاء من تدقيق جميع الكلمات!');
                    break;
                }

                // Fetch their English counterparts
                const ids = batchAr.map(b => `"${b.strongs_id}"`).join(',');
                const batchEn = await reqSupabase(`/strongs_entries?strongs_id=in.(${ids})&select=strongs_id,original_word,definition_en,kjv_usage`);

                // Combine them
                const entriesToAudit = batchAr.map(ar => {
                    const en = batchEn.find(e => e.strongs_id === ar.strongs_id) || {};
                    return {
                        strongs_id: ar.strongs_id,
                        id: ar.id,
                        original_word: en.original_word || '',
                        definition_en: en.definition_en || '',
                        kjv_usage: en.kjv_usage || ''
                    };
                });

                log(`جاري تحليل وتدقيق المجموعة بواسطة الذكاء الاصطناعي...`);
                
                try {
                    const auditedList = await askGemini(entriesToAudit);
                    
                    // Update Database
                    for (const audited of auditedList) {
                        const targetId = audited.id; // It should be the strongs_id (e.g., H123)
                        
                        // Patch in Supabase
                        await reqSupabase(`/strongs_ar_translations?strongs_id=eq.${targetId}`, 'PATCH', {
                            pronunciation_ar: audited.pronunciation_ar,
                            definition_ar: audited.definition_ar,
                            notes_ar: audited.notes_ar,
                            is_verified: true
                        });
                        log(`✅ تم تحديث وتوثيق الكلمة: ${targetId}`);
                        processedCount++;
                    }

                    // Update UI Progress
                    document.getElementById('progressText').innerText = `${processedCount} / ${totalUnverified}`;
                    const percent = Math.min(100, (processedCount / totalUnverified) * 100);
                    document.getElementById('progressBar').style.width = percent + '%';

                    if (processedCount >= totalUnverified) break;

                    log(`⏳ انتظار ${(DELAY_MS/1000)} ثانية لتجنب الحظر...`);
                    await new Promise(r => setTimeout(r, DELAY_MS));

                } catch (e) {
                    log(`❌ خطأ أثناء التدقيق: ${e.message}`);
                    log(`⏳ سنحاول مجدداً بعد 30 ثانية...`);
                    await new Promise(r => setTimeout(r, 30000));
                }
            }

        } catch (e) {
            log(`❌ خطأ فادح: ${e.message}`);
        }

        stopAudit();
    }

    function stopAudit() {
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('statusText').innerText = 'الحالة: متوقف.';
        log('تم إيقاف التدقيق.');
    }
</script>

</body>
</html>
