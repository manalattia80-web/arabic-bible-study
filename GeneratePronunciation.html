<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد النطق المكتوب لقاموس سترونج</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-scale; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 10px; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        #log { margin-top: 20px; padding: 10px; background: #222; color: #0f0; height: 300px; overflow-y: auto; border-radius: 4px; font-family: monospace; white-space: pre-wrap; direction: ltr; text-align: left; }
        .progress-container { margin-top: 20px; background-color: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-bar { width: 0%; height: 20px; background-color: #28a745; text-align: center; color: white; line-height: 20px; font-size: 12px; transition: width 0.3s; }
        #error-box { background: #ffe6e6; color: #d93025; padding: 10px; border: 1px solid #f2a6a6; display: none; margin-bottom: 15px; border-radius: 4px; direction: ltr; text-align: left;}
    </style>
</head>
<body>
    <div class="container">
        <div id="error-box"></div>
        <h1>🎙️ أداة توليد النطق المكتوب (عربي)</h1>
        
        <label>رابط قاعدة البيانات (Supabase URL)</label>
        <input type="text" id="supabaseUrl" placeholder="https://xyzcompany.supabase.co">
        
        <label>المفتاح السري (Supabase Service Key)</label>
        <input type="password" id="supabaseKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5c...">

        <label>مفتاح الذكاء الاصطناعي (Gemini API Key)</label>
        <input type="password" id="geminiKey" placeholder="AIzaSy...">
        <small style="color: #666; display: block; margin-top: 5px;">* إذا لم يكن لديك مفتاح، يمكنك الحصول عليه مجاناً من <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></small>

        <button id="startBtn" onclick="startProcess()">▶️ ابدأ التوليد</button>
        <button id="stopBtn" onclick="stopProcess()" style="background-color: #dc3545; display: none;">⏸️ إيقاف</button>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar">0%</div>
        </div>

        <div id="log">Logs will appear here...</div>
    </div>

    <!-- Catch all global errors -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errBox = document.getElementById('error-box');
            errBox.style.display = 'block';
            errBox.innerHTML += `<strong>Global Error:</strong> ${message} at line ${lineno}<br>`;
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        let isRunning = false;
        let supabaseClient = null;
        let geminiModelName = "models/gemini-flash-latest";

        async function fetchGeminiPronunciation(geminiKey, originalWord, transliteration, language) {
            const prompt = `Return ONLY the Arabic transliteration (phonetic spelling) for the Biblical ${language} word "${originalWord}" (English phonetics: "${transliteration}"). Do not include any translation, meaning, explanation, punctuation or extra text. Output only the Arabic phonetic word. Example: ريشيث`;
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${geminiModelName}:generateContent?key=${geminiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.1 }
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Gemini API Error: ${response.status} - ${errText}`);
            }
            
            const data = await response.json();
            if(!data.candidates || !data.candidates[0].content) {
                throw new Error("Unexpected Gemini response format");
            }
            let result = data.candidates[0].content.parts[0].text.trim();
            result = result.replace(/`/g, '').replace(/"/g, '').trim();
            return result;
        }

        async function startProcess() {
            try {
                const url = document.getElementById('supabaseUrl').value.trim();
                const key = document.getElementById('supabaseKey').value.trim();
                const geminiKey = document.getElementById('geminiKey').value.trim();

                if (!url || !key || !geminiKey) {
                    alert("يرجى تعبئة جميع الحقول المطلوبة (Supabase و Gemini).");
                    return;
                }

                isRunning = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';

                log("🔍 جاري فحص الموديلات المتاحة في حسابك لتفادي الحد الأقصى (20 طلب/يوم)...");
                try {
                    const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${geminiKey}`);
                    const listData = await listRes.json();
                    const availableModels = listData.models
                        .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
                        .map(m => m.name);
                    log(`الموديلات المتاحة لك: ${availableModels.join(', ')}`);
                } catch(e) {
                    log(`خطأ في جلب الموديلات: ${e.message}`);
                }

                log("🚀 جارٍ الاتصال بقاعدة البيانات...");

                if (!window.supabase) {
                    throw new Error("لم يتم تحميل مكتبة Supabase. تأكد من اتصالك بالإنترنت وأن المتصفح لا يحجبها.");
                }

                supabaseClient = window.supabase.createClient(url, key);

                log("🔍 جاري فحص ومعالجة الكلمات (سيتم جلب ومعالجة البيانات على دفعات صغيرة لتفادي الانقطاع)...");
                
                let hasMore = true;
                let page = 0;
                const pageSize = 100;
                let totalProcessed = 0;
                const estimatedTotal = 14156; // تقريبي لتشغيل شريط التقدم

                while (hasMore && isRunning) {
                    log(`⏳ جاري جلب الدفعة ${page + 1}...`);
                    
                    let data = null;
                    let retries = 3;
                    while(retries > 0) {
                        try {
                            const result = await supabaseClient
                                .from('strongs_entries')
                                .select('strongs_id, original_word, transliteration, pronunciation, language, strongs_ar_translations(pronunciation_ar)')
                                .range(page * pageSize, (page + 1) * pageSize - 1);
                            if (result.error) throw result.error;
                            data = result.data;
                            break; 
                        } catch(err) {
                            retries--;
                            if (retries === 0) throw err;
                            log(`⚠️ فشل جلب الدفعة ${page + 1}، جاري إعادة المحاولة...`);
                            await new Promise(r => setTimeout(r, 2000));
                        }
                    }

                    if (data.length === 0) {
                        hasMore = false;
                        break;
                    }

                    const missing = data.filter(e => {
                        const tr = e.strongs_ar_translations;
                        return !tr || !tr.pronunciation_ar || tr.pronunciation_ar.trim() === '';
                    });

                    if (missing.length > 0) {
                        // معالجة الدفعة في مجموعات (Batching) لتفادي حدود Rate Limit
                        const batchSize = 25; // 25 كلمة في كل طلب لـ Gemini
                        for (let i = 0; i < missing.length; i += batchSize) {
                            if (!isRunning) break;
                            const currentBatch = missing.slice(i, i + batchSize);
                            
                            log(`🤖 جاري طلب ترجمة ${currentBatch.length} كلمات دفعة واحدة من الذكاء الاصطناعي...`);
                            
                            // تجهيز نص الطلب
                            const promptInput = currentBatch.map(e => {
                                return `ID: ${e.strongs_id} | Word: ${e.original_word} | Phonetic: ${e.pronunciation || e.transliteration} | Lang: ${e.language}`;
                            }).join('\n');

                            const prompt = `You are a linguistic expert. Transliterate the following Biblical words into Arabic letters (phonetic spelling) to show how they are pronounced.
                            
Input list:
${promptInput}

Output format: Return ONLY a valid JSON object where the key is the ID, and the value is the Arabic phonetic spelling. Example: {"H1": "آب", "H2": "آبا"}
Do not include markdown blocks like \`\`\`json. Return raw JSON only.`;

                            let batchSuccess = false;
                            let retryAttempts = 5;

                            while (!batchSuccess && retryAttempts > 0) {
                                try {
                                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${geminiModelName}:generateContent?key=${geminiKey}`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            contents: [{ parts: [{ text: prompt }] }],
                                            generationConfig: { temperature: 0.1 }
                                        })
                                    });

                                    if (!response.ok) {
                                        const errText = await response.text();
                                        throw new Error(`Gemini API Error: ${response.status} - ${errText}`);
                                    }
                                    
                                    const data = await response.json();
                                    if(!data.candidates || !data.candidates[0].content) {
                                        throw new Error("Unexpected Gemini response format");
                                    }
                                    
                                    let resultText = data.candidates[0].content.parts[0].text.trim();
                                    resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
                                    
                                    const parsedResult = JSON.parse(resultText);

                                    // تحديث قاعدة البيانات
                                    for (const entry of currentBatch) {
                                        const arabicPronunciation = parsedResult[entry.strongs_id];
                                        if (!arabicPronunciation) {
                                            log(`⚠️ لم يقم الذكاء الاصطناعي بإرجاع نطق للكلمة ${entry.strongs_id}`);
                                            continue;
                                        }

                                        const { data: existingTr, error: fetchErr } = await supabaseClient
                                            .from('strongs_ar_translations')
                                            .select('id')
                                            .eq('strongs_id', entry.strongs_id)
                                            .maybeSingle();

                                        if (fetchErr) throw fetchErr;

                                        let dbErr;
                                        if (existingTr) {
                                            const { error } = await supabaseClient
                                                .from('strongs_ar_translations')
                                                .update({ pronunciation_ar: arabicPronunciation })
                                                .eq('strongs_id', entry.strongs_id);
                                            dbErr = error;
                                        } else {
                                            const { error } = await supabaseClient
                                                .from('strongs_ar_translations')
                                                .insert({ 
                                                    strongs_id: entry.strongs_id, 
                                                    definition_ar: 'يُرجى التحديث', 
                                                    pronunciation_ar: arabicPronunciation 
                                                });
                                            dbErr = error;
                                        }

                                        if (dbErr) throw dbErr;

                                        totalProcessed++;
                                        log(`✅ [تمت معالجة ${totalProcessed}] ${entry.strongs_id} -> ${arabicPronunciation}`);
                                    }
                                    batchSuccess = true; // النجاح

                                } catch (e) {
                                    retryAttempts--;
                                    log(`❌ خطأ في معالجة المجموعة: ${e.message.substring(0, 150)}...`);
                                    if (retryAttempts > 0) {
                                        log(`⏳ يبدو أننا وصلنا للحد الأقصى المسموح به في الدقيقة (Rate Limit). سيتم الانتظار لمدة 65 ثانية لتجديد الرصيد ثم إعادة المحاولة... (المحاولات المتبقية: ${retryAttempts})`);
                                        await new Promise(r => setTimeout(r, 65000));
                                    } else {
                                        log(`🚫 فشلت معالجة هذه الدفعة نهائياً وتم تخطيها.`);
                                    }
                                }
                            }

                            // تحديث شريط التقدم التقريبي
                            const percent = Math.min(Math.floor(((page * pageSize + totalProcessed) / estimatedTotal) * 100), 100);
                            const pBar = document.getElementById('progressBar');
                            pBar.style.width = `${percent}%`;
                            pBar.innerText = `${percent}%`;

                            // انتظار بين الطلبات لتجنب الضغط (10 ثوانٍ)
                            await new Promise(r => setTimeout(r, 10000)); 
                        }
                    } else {
                         log(`✨ الدفعة ${page + 1} مكتملة مسبقاً، تخطي...`);
                         const percent = Math.min(Math.floor(((page + 1) * pageSize / estimatedTotal) * 100), 100);
                         const pBar = document.getElementById('progressBar');
                         pBar.style.width = `${percent}%`;
                         pBar.innerText = `${percent}%`;
                    }

                    page++;
                }

                if (isRunning) {
                    log("🏁 اكتملت العملية بالكامل!");
                }

            } catch (err) {
                log(`❌ حدث خطأ جذري: ${err.message}`);
                console.error(err);
            }

            stopProcess();
        }

        function stopProcess() {
            isRunning = false;
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
        }
    </script>
</body>
</html>
