name: arabic_bible_study
description: Arabic Van Dyck Bible Study — Flutter Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # Audio playback
  just_audio: ^0.9.40

  # Fonts
  google_fonts: ^6.2.1

  # Persistence
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#F7F6F3"

flutter:
  uses-material-design: true

  # Uncomment if adding local font files later (e.g. SBL Hebrew/Greek)
  # fonts:
  #   - family: SBLHebrew
  #     fonts:
  #       - asset: assets/fonts/SBLHebrew.ttf
  #   - family: SBLGreek
  #     fonts:
  #       - asset: assets/fonts/SBLGreek.ttf
