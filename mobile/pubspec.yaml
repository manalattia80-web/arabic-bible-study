name: arabic_bible_study
description: Arabic Van Dyck Bible Study — Flutter Mobile App
publish_to: 'none'
version: 1.0.10+11

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Offline Local Database
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # Networking
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # Audio playback
  just_audio: ^0.9.40

  # Fonts
  google_fonts: ^6.2.1

  # Persistence
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo_adaptive.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/logo_adaptive.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/bible_study.db

  # Uncomment if adding local font files later (e.g. SBL Hebrew/Greek)
  # fonts:
  #   - family: SBLHebrew
  #     fonts:
  #       - asset: assets/fonts/SBLHebrew.ttf
  #   - family: SBLGreek
  #     fonts:
  #       - asset: assets/fonts/SBLGreek.ttf
