            const supabaseUrl = document.getElementById('supabaseUrl').value.trim();
            const supabaseKey = document.getElementById('supabaseKey').value.trim();

            if (!supabaseUrl || !supabaseKey) return alert('أدخل بيانات Supabase');

            document.getElementById('startBtn').disabled = true;
            log('جاري الاتصال بـ Supabase وطلب آيات تكوين الإصحاح الأول...');

            try {
                const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                
                // جلب تكوين (1) الإصحاح (1)
                const { data: verses, error } = await supabase
                    .from('verses')
                    .select('id, text_avd_ar, text_original_lang')
                    .eq('book_id', 1)
                    .eq('chapter_num', 1)
                    .order('verse_num', { ascending: true });
                    
                if (error) throw error;
                if (!verses || verses.length === 0) throw new Error("لم يتم العثور على آيات تكوين 1");

                log(`تم جلب ${verses.length} آية بنجاح.`);
                
                let jsonIndex = 0;
                let batch = [];
                let wordsMappedCount = 0;

                for (let i = 0; i < verses.length; i++) {
                    const verse = verses[i];
                    
                    // تنظيف الكلمات كما في الواجهة الأمامية
                    const cleanText = verse.text_avd_ar.replace(/[.,:;«»!؟?]/g, '');
                    const words = cleanText.split(/\s+/).filter(w => w.trim().length > 0);
                    
                    for (let pos = 0; pos < words.length; pos++) {
                        if (jsonIndex >= aiData.length) {
                            log(`⚠️ تحذير: انتهت البيانات المرسلة قبل انتهاء الآيات عند الكلمة: ${words[pos]}`);
                            break;
                        }

                        const mapping = aiData[jsonIndex];
                        jsonIndex++;
                        
                        let origWord = mapping.strongs === 'H0' || mapping.strongs === 'G0' ? '---' : mapping.strongs;
                        
                        batch.push({
                            verse_id: verse.id,
                            ar_word_position: pos + 1,
                            orig_word_position: pos + 1,
                            ar_word: words[pos], 
                            orig_word: origWord,
                            orig_word_lang: verse.text_original_lang || 'hebrew',
                            strongs_id: mapping.strongs,
                            orig_morphology: '',
                            transliteration_ar: '',
                            transliteration_lat: '',
                            audio_url: '',
                            audio_duration_ms: 0,
                            is_verified: true // مراجعة واعتماد
                        });
                        wordsMappedCount++;
                    }
                }

                log(`جاري رفع ${batch.length} كلمة مربوطة إلى قاعدة البيانات...`);

                const { error: insErr } = await supabase.from('word_mappings').upsert(batch, { onConflict: 'verse_id, ar_word_position, orig_word_position' });
                if (insErr) {
                    log(`❌ خطأ أثناء الرفع: ${insErr.message}`);
                } else {
                    log(`🎉 تمت العملية بنجاح! تم رفع الإصحاح الأول بالكامل (تكوين 1) للـ ${wordsMappedCount} كلمة.`);
                    log(`الآن افتح تطبيق الموبايل على (تكوين 1) وسترى النتيجة المذهلة!`);
                }
                
            } catch (err) {
                log(`❌ خطأ: ${err.message}`);
            } finally {
                document.getElementById('startBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
