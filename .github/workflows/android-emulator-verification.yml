name: Android Emulator Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - '.github/workflows/android-emulator-verification.yml'
      - 'scripts/run_android_emulator_v375_test.cjs'

jobs:
  verify-android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install System Dependencies (SQLite3, FFmpeg, Zip, Tesseract OCR with Arabic)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 ffmpeg zip tesseract-ocr tesseract-ocr-ara

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Evidence Directory
        run: mkdir -p emulator_evidence_v375

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Download Baseline v1.0.374 APK
        run: |
          V374_URL="https://github.com/manalattia80-web/arabic-bible-study/releases/download/v1.0.374/arabic-bible-study-app.apk"
          echo "Downloading baseline v1.0.374 APK from: $V374_URL"
          curl -L -f -o v374_baseline.apk "$V374_URL"
          echo "v374 APK Size: $(wc -c < v374_baseline.apk) bytes"
          EXPECTED_374_SHA="99ad2e8915a6d7285676b5bd8938de476fdb309e7a24e95b1fdefd1a4b792868"
          ACTUAL_374_SHA=$(sha256sum v374_baseline.apk | awk '{print $1}')
          echo "Expected v374 SHA-256: $EXPECTED_374_SHA"
          echo "Actual v374 SHA-256:   $ACTUAL_374_SHA"
          if [ "$ACTUAL_374_SHA" != "$EXPECTED_374_SHA" ]; then
            echo "ERROR: Baseline v1.0.374 APK SHA-256 mismatch!"
            exit 1
          fi

      - name: Obtain & Verify Official Published v1.0.375 APK
        run: |
          V375_URL="https://github.com/manalattia80-web/arabic-bible-study/releases/download/v1.0.375/arabic-bible-study-app.apk"
          echo "Downloading official published v1.0.375 APK from: $V375_URL"
          curl -L -f -o v375_candidate.apk "$V375_URL"
          echo "Downloaded APK Size: $(wc -c < v375_candidate.apk) bytes"
          EXPECTED_SHA="67844ee95fef07abcde4f1468c740cfd3f90677f68d7ee840e552ce33cc706e7"
          ACTUAL_SHA=$(sha256sum v375_candidate.apk | awk '{print $1}')
          echo "Expected SHA-256: $EXPECTED_SHA"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: APK SHA-256 mismatch with published v1.0.375!"
            exit 1
          fi
          sha256sum v375_candidate.apk | tee emulator_evidence_v375/apk_sha256.txt

      - name: Verify Built APK Chunks & Asset Integrity (Post-Build Gate)
        run: node scripts/verify_apk_asset_integrity.cjs v375_candidate.apk

      - name: Run Android Emulator Clean Install & Upgrade Verification Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            echo "=== Launching v1.0.375 Clean Install & v374->v375 Upgrade Test Suite on Live Android API 33 Emulator ==="
            node scripts/run_android_emulator_v375_test.cjs

      - name: Display Test Results & Execution Summary
        if: always()
        run: |
          echo "========================================================================"
          echo "  ANDROID EMULATOR VERIFICATION RESULTS (test-results.xml)"
          echo "========================================================================"
          cat emulator_evidence_v375/test-results.xml || true

          echo "========================================================================"
          echo "  SHARED PREFERENCES BEFORE UPGRADE (v374)"
          echo "========================================================================"
          cat emulator_evidence_v375/prefs_before_upgrade.xml || true

          echo "========================================================================"
          echo "  SHARED PREFERENCES AFTER UPGRADE (v375)"
          echo "========================================================================"
          cat emulator_evidence_v375/prefs_after_upgrade.xml || true

          for f in emulator_evidence_v375/*_ocr.txt; do
            echo "========================================================================"
            echo "  OCR: $f"
            echo "========================================================================"
            cat "$f" || true
          done

      - name: Upload Android Emulator v1.0.375 Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-v375-evidence
          path: |
            android_emulator_v375_evidence.zip
            emulator_evidence_v375/

      - name: Attach Evidence Archive to Official Release v1.0.375
        if: success()
        run: |
          if [ -f "android_emulator_v375_evidence.zip" ]; then
            gh release upload v1.0.375 android_emulator_v375_evidence.zip --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
