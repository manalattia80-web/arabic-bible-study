name: Android Emulator Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - '.github/workflows/android-emulator-verification.yml'
      - 'scripts/run_android_emulator_v372_test.cjs'

jobs:
  verify-android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install System Dependencies (SQLite3, FFmpeg, Zip, Tesseract OCR with Arabic)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 ffmpeg zip tesseract-ocr tesseract-ocr-ara

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Evidence Directory
        run: mkdir -p emulator_evidence_v372

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Download Baseline v1.0.370 APK
        run: |
          V370_URL="https://github.com/manalattia80-web/arabic-bible-study/releases/download/v1.0.370/arabic-bible-study-app.apk"
          echo "Downloading baseline v1.0.370 APK from: $V370_URL"
          curl -L -f -o v370_baseline.apk "$V370_URL"
          echo "v370 APK Size: $(wc -c < v370_baseline.apk) bytes"

      - name: Obtain & Verify Official Published v1.0.372 APK
        run: |
          V372_URL="https://github.com/manalattia80-web/arabic-bible-study/releases/download/v1.0.372/arabic-bible-study-app.apk"
          echo "Downloading official published v1.0.372 APK from: $V372_URL"
          curl -L -f -o v372_candidate.apk "$V372_URL"
          echo "Downloaded APK Size: $(wc -c < v372_candidate.apk) bytes"
          EXPECTED_SHA="9e059d4d015da0b6e064044b2ea7a113dc39aa44784ad864cf2f02e2648ea974"
          ACTUAL_SHA=$(sha256sum v372_candidate.apk | awk '{print $1}')
          echo "Expected SHA-256: $EXPECTED_SHA"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: APK SHA-256 mismatch with published v1.0.372!"
            exit 1
          fi
          sha256sum v372_candidate.apk | tee emulator_evidence_v372/apk_sha256.txt

      - name: Verify Built APK Chunks & Asset Integrity (Post-Build Gate)
        run: node scripts/verify_apk_asset_integrity.cjs v372_candidate.apk

      - name: Run Android Emulator Clean Install & Upgrade Verification Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            echo "=== Launching v1.0.372 Clean Install & v370->v372 Upgrade Test Suite on Live Android API 33 Emulator ==="
            node scripts/run_android_emulator_v372_test.cjs

      - name: Display Test Results & Execution Summary
        if: always()
        run: |
          echo "========================================================================"
          echo "  ANDROID EMULATOR VERIFICATION RESULTS (test-results.xml)"
          echo "========================================================================"
          cat emulator_evidence_v372/test-results.xml || true
          
          echo "========================================================================"
          echo "  SHARED PREFERENCES BEFORE UPGRADE (v370)"
          echo "========================================================================"
          cat emulator_evidence_v372/prefs_before_upgrade.xml || true

          echo "========================================================================"
          echo "  SHARED PREFERENCES AFTER UPGRADE (v372)"
          echo "========================================================================"
          cat emulator_evidence_v372/prefs_after_upgrade.xml || true
          
          echo "========================================================================"
          echo "  RAW OCR: CLEAN INSTALL 1 KINGS 18:21 H5587 CARD"
          echo "========================================================================"
          cat emulator_evidence_v372/clean_install_1kgs_h5587_card_ocr.txt || true

          echo "========================================================================"
          echo "  RAW OCR: UPGRADE 1 KINGS 18:21 H5587 CARD"
          echo "========================================================================"
          cat emulator_evidence_v372/upgrade_1kgs_h5587_card_ocr.txt || true

      - name: Upload Android Emulator v1.0.372 Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-v372-evidence
          path: |
            android_emulator_v372_evidence.zip
            emulator_evidence_v372/

      - name: Attach Evidence Archive to Official Release v1.0.372
        if: success()
        run: |
          if [ -f "android_emulator_v372_evidence.zip" ]; then
            gh release upload v1.0.372 android_emulator_v372_evidence.zip --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
