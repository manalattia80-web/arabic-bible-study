name: Android Emulator Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - '.github/workflows/android-emulator-verification.yml'
      - 'scripts/run_android_emulator_v373_test.cjs'

jobs:
  verify-android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install System Dependencies (SQLite3, FFmpeg, Zip, Tesseract OCR with Arabic)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 ffmpeg zip tesseract-ocr tesseract-ocr-ara

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Evidence Directory
        run: mkdir -p emulator_evidence_v373

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Download Baseline v1.0.372 APK
        run: |
          V372_URL="https://github.com/manalattia80-web/arabic-bible-study/releases/download/v1.0.372/arabic-bible-study-app.apk"
          echo "Downloading baseline v1.0.372 APK from: $V372_URL"
          curl -L -f -o v372_baseline.apk "$V372_URL"
          echo "v372 APK Size: $(wc -c < v372_baseline.apk) bytes"
          EXPECTED_372_SHA="9e059d4d015da0b6e064044b2ea7a113dc39aa44784ad864cf2f02e2648ea974"
          ACTUAL_372_SHA=$(sha256sum v372_baseline.apk | awk '{print $1}')
          echo "Expected v372 SHA-256: $EXPECTED_372_SHA"
          echo "Actual v372 SHA-256:   $ACTUAL_372_SHA"
          if [ "$ACTUAL_372_SHA" != "$EXPECTED_372_SHA" ]; then
            echo "ERROR: Baseline v1.0.372 APK SHA-256 mismatch!"
            exit 1
          fi

      - name: Obtain & Verify Official Published v1.0.373 APK
        run: |
          V373_URL="https://github.com/manalattia80-web/arabic-bible-study/releases/download/v1.0.373/arabic-bible-study-app.apk"
          echo "Downloading official published v1.0.373 APK from: $V373_URL"
          curl -L -f -o v373_candidate.apk "$V373_URL"
          echo "Downloaded APK Size: $(wc -c < v373_candidate.apk) bytes"
          EXPECTED_SHA="977328caccb2a8165385de99986a095926cc5229abd8105879612561d6a5e0a9"
          ACTUAL_SHA=$(sha256sum v373_candidate.apk | awk '{print $1}')
          echo "Expected SHA-256: $EXPECTED_SHA"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: APK SHA-256 mismatch with published v1.0.373!"
            exit 1
          fi
          sha256sum v373_candidate.apk | tee emulator_evidence_v373/apk_sha256.txt

      - name: Verify Built APK Chunks & Asset Integrity (Post-Build Gate)
        run: node scripts/verify_apk_asset_integrity.cjs v373_candidate.apk

      - name: Run Android Emulator Clean Install & Upgrade Verification Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            echo "=== Launching v1.0.373 Clean Install & v372->v373 Upgrade Test Suite on Live Android API 33 Emulator ==="
            node scripts/run_android_emulator_v373_test.cjs

      - name: Display Test Results & Execution Summary
        if: always()
        run: |
          echo "========================================================================"
          echo "  ANDROID EMULATOR VERIFICATION RESULTS (test-results.xml)"
          echo "========================================================================"
          cat emulator_evidence_v373/test-results.xml || true

          echo "========================================================================"
          echo "  SHARED PREFERENCES BEFORE UPGRADE (v372)"
          echo "========================================================================"
          cat emulator_evidence_v373/prefs_before_upgrade.xml || true

          echo "========================================================================"
          echo "  SHARED PREFERENCES AFTER UPGRADE (v373)"
          echo "========================================================================"
          cat emulator_evidence_v373/prefs_after_upgrade.xml || true

          for f in emulator_evidence_v373/*_ocr.txt; do
            echo "========================================================================"
            echo "  OCR: $f"
            echo "========================================================================"
            cat "$f" || true
          done

      - name: Upload Android Emulator v1.0.373 Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-v373-evidence
          path: |
            android_emulator_v373_evidence.zip
            emulator_evidence_v373/

      - name: Attach Evidence Archive to Official Release v1.0.373
        if: success()
        run: |
          if [ -f "android_emulator_v373_evidence.zip" ]; then
            gh release upload v1.0.373 android_emulator_v373_evidence.zip --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
