name: Play Store Prep & Bundletool Audit

on:
  push:
    branches: [ "release/**" ]
    paths:
      - '.github/workflows/play-prep-audit.yml'
      - 'mobile/**'
      - 'scripts/patch_gradle.cjs'
      - 'scripts/run_emulator_clean_and_upgrade_test.sh'
  workflow_dispatch:
    inputs:
      require_play_secrets:
        description: 'Fail immediately if PLAY_* GitHub Secrets are missing (default true for Play uploads)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-and-verify-play-v388:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK API 36, Build-Tools 36 & NDK r28
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.12433566"

      - name: Set up Latest Stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Signing Keystore from Secrets (Strict on workflow_dispatch)
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_PLAY_SECRETS: ${{ inputs.require_play_secrets }}
        run: |
          if [ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$PLAY_KEYSTORE_PASSWORD" ] && [ -n "$PLAY_KEY_ALIAS" ] && [ -n "$PLAY_KEY_PASSWORD" ]; then
            echo "Using production Play Upload Keystore from GitHub Secrets."
            echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > /tmp/play_upload.jks
            echo "ANDROID_KEYSTORE_PATH=/tmp/play_upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$PLAY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$PLAY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$PLAY_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=PLAY_SECRETS" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REQUIRE_PLAY_SECRETS" != "false" ]; then
            echo "::error::Missing required Play Upload Keystore Secrets! Configure PLAY_UPLOAD_KEYSTORE_BASE64, PLAY_KEYSTORE_PASSWORD, PLAY_KEY_ALIAS, and PLAY_KEY_PASSWORD before running a Play release build."
            exit 1
          else
            echo "::warning::SIGNING_MODE=CI_EPHEMERAL_TEST_ONLY — NOT suitable for Google Play upload or upgrading an existing device install."
            EPHEM_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore /tmp/ci_ephemeral.jks \
              -storepass "$EPHEM_PASS" -keypass "$EPHEM_PASS" \
              -alias ci_ephemeral -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=CI Ephemeral Verification,O=ArabicBibleStudy,C=EG" >/dev/null 2>&1
            echo "::add-mask::$EPHEM_PASS"
            echo "ANDROID_KEYSTORE_PATH=/tmp/ci_ephemeral.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$EPHEM_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=ci_ephemeral" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$EPHEM_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=CI_EPHEMERAL_TEST_ONLY" >> "$GITHUB_ENV"
          fi
          echo "REQUIRE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"

      - name: Verify Promoted v388 DB Chunks (SHA-256 d3584fe6...)
        run: |
          node scripts/assemble_db.cjs
          node scripts/verify_db_chunks_exact.cjs
          DB_SHA=$(sha256sum mobile/assets/bible_study.db | awk '{print $1}')
          echo "Assembled DB SHA-256: $DB_SHA"
          if [ "$DB_SHA" != "d3584fe697188f665e0750d8d9f133d3c4e27a7533f377be5f9c6718d908d14c" ]; then
            echo "FATAL: DB SHA-256 drifted from promoted v388!"
            exit 1
          fi

      - name: Configure Android & Resolve Dependencies
        working-directory: ./mobile
        run: |
          rm -f test/widget_test.dart
          node ../scripts/patch_gradle.cjs
          flutter pub upgrade
          dart run flutter_launcher_icons

      - name: Analyze & Unit Test (Including DISABLE_AUTO_UPDATE=true Play Policy Test)
        working-directory: ./mobile
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --dart-define=DISABLE_AUTO_UPDATE=true

      - name: Build Play-Ready AAB & APK (v1.0.388+388, API 36, DISABLE_AUTO_UPDATE=true, Offline Bundled Fonts)
        working-directory: ./mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --build-name=1.0.388 --build-number=388 \
            --dart-define=APP_BUILD_NUMBER=388 \
            --dart-define=DISABLE_AUTO_UPDATE=true
          flutter build apk --release --no-tree-shake-icons \
            --build-name=1.0.388 --build-number=388 \
            --dart-define=APP_BUILD_NUMBER=388 \
            --dart-define=DISABLE_AUTO_UPDATE=true
          cp build/app/outputs/bundle/release/app-release.aab ../play-store-bundle-v388.aab
          cp build/app/outputs/flutter-apk/app-release.apk ../arabic-bible-study-v388.apk
          ls -lh ../play-store-bundle-v388.aab ../arabic-bible-study-v388.apk
          sha256sum ../play-store-bundle-v388.aab ../arabic-bible-study-v388.apk

      - name: Verify Compressed APK Chunks Reassemble Bitwise to v388 DB
        run: node scripts/verify_apk_asset_integrity.cjs arabic-bible-study-v388.apk

      - name: Full Play Store Readiness Verification (bundletool 1.18.3, API 36, 16KB ELF & ZIP)
        run: |
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

          echo "=== PLAY PREP v388 REPORT (SIGNING_MODE=$SIGNING_MODE) ==="
          stat -c "v388_aab_bytes=%s" play-store-bundle-v388.aab
          stat -c "v388_apk_bytes=%s" arabic-bible-study-v388.apk

          java -jar bundletool.jar validate --bundle=play-store-bundle-v388.aab | tail -n 10
          java -jar bundletool.jar build-apks \
            --bundle=play-store-bundle-v388.aab \
            --output=v388_splits.apks \
            --ks="$ANDROID_KEYSTORE_PATH" \
            --ks-pass="pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass="pass:$ANDROID_KEY_PASSWORD"
          java -jar bundletool.jar get-size total --apks=v388_splits.apks
          java -jar bundletool.jar get-size total --apks=v388_splits.apks --dimensions=ABI

          mkdir -p extracted_v388
          unzip -q v388_splits.apks -d extracted_v388
          BT_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"

          "$BT_DIR/aapt2" dump badging extracted_v388/splits/base-master.apk | head -n 25
          "$BT_DIR/zipalign" -c -P 16 -v 4 extracted_v388/splits/base-arm64_v8a.apk
          "$BT_DIR/zipalign" -c -P 16 -v 4 arabic-bible-study-v388.apk
          "$BT_DIR/apksigner" verify --verbose --print-certs arabic-bible-study-v388.apk | head -n 10
          if [ "$SIGNING_MODE" = "PLAY_SECRETS" ]; then
            if "$BT_DIR/apksigner" verify --print-certs arabic-bible-study-v388.apk | grep -q "CI Ephemeral Verification"; then
              echo "FATAL: PLAY_SECRETS build must NEVER be signed with CI Ephemeral Verification!"
              exit 1
            fi
            echo "Confirmed: Signed with private Play Upload Keystore (non-ephemeral)."
          fi

          mkdir -p v388_libs
          unzip -q play-store-bundle-v388.aab "base/lib/*" -d v388_libs
          FAIL_16K=0
          for so in $(find v388_libs -name "*.so" | sort); do
            aligns=$(readelf -lW "$so" | awk '$1=="LOAD" {print $NF}' | sort -u | tr '\n' ' ')
            echo "  $so -> LOAD Align: $aligns"
            if echo "$so" | grep -qE "arm64-v8a|x86_64"; then
              for a in $aligns; do
                dec=$((a))
                if [ "$dec" -lt 16384 ]; then
                  echo "  [FAIL] $so has LOAD align $a (< 16384)"
                  FAIL_16K=1
                fi
              done
            fi
          done
          if [ "$FAIL_16K" -ne 0 ]; then exit 1; fi
          echo "ALL 64-bit native libraries verified 16KB ELF aligned!"

      - name: Upload Play-Ready v388 AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: play-internal-prep-v1.0.388
          path: |
            play-store-bundle-v388.aab
            arabic-bible-study-v388.apk

  emulator-runtime-clean-and-upgrade:
    needs: build-and-verify-play-v388
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: play-internal-prep-v1.0.388
          path: artifacts

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Real Emulator Offline Clean-Install & Upgrade-Over-v382 Verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6G
          ram-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/run_emulator_clean_and_upgrade_test.sh

      - name: Upload Emulator Evidence (logcat, screenshot, ui.xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-runtime-evidence-v1.0.388
          if-no-files-found: warn
          path: emulator_evidence/
