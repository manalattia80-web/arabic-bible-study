name: Feature UI/UX Acceptance Emulator Verification

on:
  push:
    branches: [ "feature/ui-ux-refinement" ]
    paths:
      - 'mobile/**'
      - 'scripts/run_acceptance_scenarios_350.cjs'
      - '.github/workflows/feature-emulator-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-acceptance-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install System Dependencies (SQLite3, FFmpeg, Zip, Tesseract OCR with Arabic)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 ffmpeg zip tesseract-ocr tesseract-ocr-ara

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Configure Flutter Android Project
        working-directory: ./mobile
        run: |
          rm -f test/widget_test.dart
          node ../scripts/patch_gradle.cjs

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Extract Canonical App Version from pubspec.yaml
        run: |
          RAW_VER=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VER" | cut -d'+' -f2)
          echo "APP_VER_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "APP_VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "APP_RELEASE_TAG=v$VER_NAME" >> $GITHUB_ENV
          echo "Canonical Version: $VER_NAME, Build: $VER_CODE, Tag: v$VER_NAME"

      - name: Build Experimental APK from feature branch
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }} --dart-define=DISABLE_AUTO_UPDATE=true
          cp build/app/outputs/flutter-apk/app-release.apk ../arabic-bible-study-app.apk
          echo "APK Built Successfully: $(wc -c < ../arabic-bible-study-app.apk) bytes"

      - name: Run Android Emulator Acceptance Scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            echo "=== Installing Experimental APK on Android Emulator ==="
            adb install -r arabic-bible-study-app.apk
            echo "=== Launching MainActivity for initial database setup ==="
            adb shell am start -n com.arabicbible.study/.MainActivity
            sleep 5
            echo "=== Launching 5 Acceptance Scenarios Suite ==="
            node scripts/run_acceptance_scenarios_350.cjs

      - name: Display Acceptance Results & Summary
        if: always()
        run: |
          echo "========================================================================"
          echo "  ACCEPTANCE SCENARIOS TEST RESULTS (acceptance-test-results.xml)"
          echo "========================================================================"
          cat acceptance_evidence/acceptance-test-results.xml || true
          
          if [ -d "acceptance_evidence" ]; then
            cd acceptance_evidence
            zip -r ../feature_acceptance_evidence.zip ./*
            cd ..
          fi

      - name: Commit and Push Acceptance Evidence to Branch
        if: always()
        run: |
          if [ -d "acceptance_evidence" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add acceptance_evidence/
            git commit -m "docs(evidence): emulator acceptance verification run artifacts [skip ci]" || true
            git push origin feature/ui-ux-refinement || true
          fi

      - name: Upload Acceptance Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-ui-ux-acceptance-evidence
          path: |
            feature_acceptance_evidence.zip
            acceptance_evidence/
