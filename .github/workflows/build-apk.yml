name: Build Android APK

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      - name: Configure Flutter Android Project
        working-directory: ./mobile
        run: |
          rm -f test/widget_test.dart
          node ../scripts/patch_gradle.cjs

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Generate App Icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons

      - name: Install SQLite3 for Linux Runner
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Run Rigorous Scientific & Database Quality Gate
        run: node scripts/automated_database_audit.cjs

      - name: Run 20-Verse Canonical Manifest Quality Gate
        run: node scripts/audit_20_verses_311_units.cjs

      - name: Run Negative Quality Gate Suite (Forbidden States CI Check)
        run: node scripts/test_negative_rules.cjs

      - name: Analyze Dart Code (Fail on Fatal Errors)
        working-directory: ./mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter Unit Tests (WordMapping & Models Invariant)
        working-directory: ./mobile
        run: flutter test

      - name: Extract Canonical App Version from pubspec.yaml
        run: |
          RAW_VER=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VER" | cut -d'+' -f2)
          echo "APP_VER_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "APP_VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "APP_RELEASE_TAG=v$VER_NAME" >> $GITHUB_ENV
          echo "Canonical Version: $VER_NAME, Build: $VER_CODE, Tag: v$VER_NAME"

      - name: Build APK
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}
        
      - name: Find and Copy APK
        working-directory: ./mobile
        run: |
          APK_PATH=$(find build -name "*.apk" | grep release | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../arabic-bible-study-app.apk

      - name: Build App Bundle (AAB for Google Play Store)
        working-directory: ./mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}

      - name: Find and Copy AAB
        working-directory: ./mobile
        run: |
          AAB_PATH=$(find build -name "*.aab" | grep release | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -name "*.aab" | head -n 1)
          fi
          echo "Found AAB at: $AAB_PATH"
          cp "$AAB_PATH" ../play-store-bundle.aab

      - name: Verify Release Commit and Tag Matching
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Verified commit SHA: $CURRENT_SHA"
          echo "GitHub context SHA: ${{ github.sha }}"
          if [ "$CURRENT_SHA" != "${{ github.sha }}" ]; then
            echo "ERROR: HEAD commit ($CURRENT_SHA) does not match workflow SHA (${{ github.sha }})"
            exit 1
          fi

      - name: Compute SHA-256 Hashes and Generate Release Notes
        run: |
          APK_HASH=$(sha256sum arabic-bible-study-app.apk | awk '{print $1}')
          DB_HASH=$(sha256sum mobile/assets/bible_study.db | awk '{print $1}')
          echo "$APK_HASH" > apk_sha256.txt
          echo "$DB_HASH" > db_sha256.txt
          
          cat << 'EOF' > release_notes.md
          # Arabic Bible Study ${{ env.APP_RELEASE_TAG }}

          ## 🛡️ Build & Cryptographic Verification
          - **Release Tag**: `${{ env.APP_RELEASE_TAG }}`
          - **Version**: `${{ env.APP_VER_NAME }}` (Build `${{ env.APP_VER_CODE }}`)
          - **Commit SHA**: `${{ github.sha }}`
          - **APK SHA-256**: `__APK_HASH__`
          - **SQLite DB SHA-256**: `__DB_HASH__`

          ## 🚀 Database Upgrade Architecture & Data Protection (v1.0.370)
          - **Dynamic Upgrade Migration**: Bumped `targetDbVersion = 370` in `DatabaseService` with atomic temp-file assembly, pre-registration SQLite integrity check, and safe cleanup of legacy database binaries.
          - **Zero Data Loss Guarantee**: All user preferences, theme modes, font sizes, reading history, and bookmarks stored in `SharedPreferences` remain 100% intact upon upgrade.
          - **1 Kings 18:21 Full Verse Canonical Alignment (Batch 370)**:
            - **8 Base Corrections**:
              - "بَيْنَ" (pos 10): Aligned to Hebrew preposition `עַל־` (`H5921`, `HR`, locator `OSHB:B11.C18.V21.w11`), replacing false H996 at w8.
              - "الْفِرْقَتَيْنِ" (pos 11): Compound dual noun `שְׁתֵּ֣י הַסְּעִפִּים֒` (`H5587` primary `הַסְּעִפִּים֒` `HTd/Ncmpa` w13 + `H8147` secondary `שְׁתֵּ֣י` `HAcfdc` w12).
              - "الرَّبُّ" (pos 14): Locator corrected to `OSHB:B11.C18.V21.w15` (`יְהוָ֤ה`, `H3068`, `HNp`), resolving false w14 shift.
              - "هُوَ" (pos 15): Reclassified as Arabic syntactic copula (`syntactic_ar`, `NULL` strongs, `AR_SYNTACTIC:B11.C18.V21.w15`), removing false H1931.
              - "فَلَمْ" (pos 22): Locator corrected to `OSHB:B11.C18.V21.w23` (`וְלֹֽא`, `H3808`, `HC/Tn`), resolving false w22 shift.
              - "يُجِبْهُ" (pos 23): Primary verb `עָנ֥וּ` (`H6030`, `HVqp3cp`, w24) + secondary object marker suffix `אֹת֖וֹ` (`H853`, `HTo/Sp3ms`, w26).
              - "الشَّعْبُ" (pos 24): Locator corrected to `OSHB:B11.C18.V21.w25` (`הָעָ֛ם`, `H5971`, `HTd/Ncmsa`).
              - "بِكَلِمَةٍ" (pos 25): Locator corrected to `OSHB:B11.C18.V21.w27` (`דָּבָֽר`, `H1697`, `HNcmsa`).
            - **4 Refinements & Cantillation Purity**:
              - "وَقَالَ" (pos 6): Surface cantillation normalized to `וַיֹּ֨אמֶר֙` (`qadma` U+05A8 + `pashta` U+0599).
              - "تَعْرُجُونَ" (pos 9): Primary `פֹּסְחִים֮` (`H6452`, w10) + secondary 2mp pronoun `אַתֶּ֣ם` (`H859`, `HPp2mp`, w9).
              - "فَاتَّبِعُوهُ" (pos 17): Distinct components `לְכ֣וּ` (`H3212`, `HVqv2mp`, w17) + `אַחֲרָ֔יו` (`H310`, `HR/Sp3ms`, w18).
              - "فَاتَّبِعُوهُ" (pos 21): Distinct components `לְכ֣וּ` (`H3212`, `HVqv2mp`, w21) + `אַחֲרָ֑יו` (`H310`, `HR/Sp3ms`, w22).
            - **Canonical Manifest v370**: 311 units: 275 correct (88.42%), 36 errors (15 Hebrew, 21 Aramaic), 0 undecided.
          - **Negative Quality Gates 35, 36, 37, 38, 39 & Production CI**:
            - **Gate 35**: Rejection of restoring H1931 to 1Kgs 18:21 pos 15 ("هُوَ").
            - **Gate 36**: Rejection of deleting secondary numeral component H8147 from pos 11 ("الْفِرْقَتَيْنِ").
            - **Gate 37**: Rejection of deleting secondary pronominal component H859 from pos 9 ("تَعْرُجُونَ").
            - **Gate 38**: Rejection of misattributing H310 component to w17 instead of w18 in pos 17 ("فَاتَّبِعُوهُ").
            - **Gate 39**: Rejection of deleting secondary object pronoun component H853 from pos 23 ("يُجِبْهُ").
            - **Comprehensive Loci**: 66 verified direct source & morphology loci in Test 11, 39 dedicated component boundaries in Test 13.
          EOF
          
          sed -i "s/__APK_HASH__/$APK_HASH/g" release_notes.md
          sed -i "s/__DB_HASH__/$DB_HASH/g" release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arabic-bible-study-${{ env.APP_RELEASE_TAG }}
          path: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
            release_notes.md

      - name: Create Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.APP_RELEASE_TAG }}"
          target_commitish: "${{ github.sha }}"
          name: "Arabic Bible Study ${{ env.APP_RELEASE_TAG }}"
          body_path: release_notes.md
          files: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
