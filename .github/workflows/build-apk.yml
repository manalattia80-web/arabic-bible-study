name: Build Android APK

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      - name: Configure Flutter Android Project
        working-directory: ./mobile
        run: |
          rm -f test/widget_test.dart
          node ../scripts/patch_gradle.cjs

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Generate App Icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons

      - name: Install SQLite3 for Linux Runner
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Verify Exact Database Chunks and App Alignment
        run: node scripts/verify_db_chunks_exact.cjs

      - name: Run Rigorous Scientific & Database Quality Gate
        run: node scripts/automated_database_audit.cjs

      - name: Run 20-Verse Canonical Manifest Quality Gate
        run: node scripts/audit_20_verses_311_units.cjs

      - name: Run Negative Quality Gate Suite (Forbidden States CI Check)
        run: node scripts/test_negative_rules.cjs

      - name: Analyze Dart Code (Fail on Fatal Errors)
        working-directory: ./mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter Unit Tests (WordMapping & Models Invariant)
        working-directory: ./mobile
        run: flutter test

      - name: Run Clean Install & Upgrade Runtime Verification Suite
        run: node scripts/verify_runtime_clean_and_upgrade.cjs

      - name: Extract Canonical App Version from pubspec.yaml
        run: |
          RAW_VER=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VER" | cut -d'+' -f2)
          echo "APP_VER_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "APP_VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "APP_RELEASE_TAG=v$VER_NAME" >> $GITHUB_ENV
          echo "Canonical Version: $VER_NAME, Build: $VER_CODE, Tag: v$VER_NAME"

      - name: Build APK
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}
        
      - name: Find and Copy APK
        working-directory: ./mobile
        run: |
          APK_PATH=$(find build -name "*.apk" | grep release | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../arabic-bible-study-app.apk

      - name: Verify Built APK Chunks and Asset Integrity (Post-Build Gate)
        run: node scripts/verify_apk_asset_integrity.cjs arabic-bible-study-app.apk

      - name: Build App Bundle (AAB for Google Play Store)
        working-directory: ./mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}

      - name: Find and Copy AAB
        working-directory: ./mobile
        run: |
          AAB_PATH=$(find build -name "*.aab" | grep release | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -name "*.aab" | head -n 1)
          fi
          echo "Found AAB at: $AAB_PATH"
          cp "$AAB_PATH" ../play-store-bundle.aab

      - name: Verify Release Commit and Tag Matching
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Verified commit SHA: $CURRENT_SHA"
          echo "GitHub context SHA: ${{ github.sha }}"
          if [ "$CURRENT_SHA" != "${{ github.sha }}" ]; then
            echo "ERROR: HEAD commit ($CURRENT_SHA) does not match workflow SHA (${{ github.sha }})"
            exit 1
          fi

      - name: Compute SHA-256 Hashes and Generate Release Notes
        run: |
          APK_HASH=$(sha256sum arabic-bible-study-app.apk | awk '{print $1}')
          DB_HASH=$(sha256sum mobile/assets/bible_study.db | awk '{print $1}')
          echo "$APK_HASH" > apk_sha256.txt
          echo "$DB_HASH" > db_sha256.txt
          
          cat << 'EOF' > release_notes.md
          # Arabic Bible Study ${{ env.APP_RELEASE_TAG }}

          ## 🛡️ Build & Cryptographic Verification
          - **Release Tag**: `${{ env.APP_RELEASE_TAG }}`
          - **Version**: `${{ env.APP_VER_NAME }}` (Build `${{ env.APP_VER_CODE }}`)
          - **Commit SHA**: `${{ github.sha }}`
          - **APK SHA-256**: `__APK_HASH__`
          - **SQLite DB SHA-256**: `__DB_HASH__`

          ## 🚀 Daniel 4:17 Canonical OSHB Alignment — 100% 20-Verse Benchmark Completion (v1.0.376)
          - **Daniel 4:17 Full Canonical Alignment (`OSHB Dan.4.14` `w1..w27`)**: Resolved all 9 remaining benchmark errors, bringing the 20-verse benchmark from 302/311 (97.11%) to **311/311 (100.00%, 0 errors, 0 undecided)**:
            - Fixed `arPos 8` («لِكَىْ») multi-component alignment (`H1701@w8` `דִּבְרַ֡ת` `ANcfsc` construct + `H5705@w7` `עַד` + `H1768@w9` `דִּ֣י`) and `arPos 18` («مَنْ») (`H4479@w19` + `H1768@w20`).
            - Documented all 3 Ketiv/Qere pairs explicitly (`w14`/`w15` on `arPos 12`, `w17`/`w18` on `arPos 16`, `w26`/`w27` on `arPos 21`) and updated shifted loci (`w18, w21, w22, w23, w24, w25, w27`).
            - Corrected `arPos 13` (`AAamsa`), `arPos 17` (`H5415@w22`), `arPos 20` (`AVai3ms` `aphel` @ `w25`), `arPos 22` (`H8215@w23`), set Aramaic construct on `arPos 3, 6, 8, 15, 22`, and cleaned all stale error notes.
            - Preserved OSHB literal tag `AVqp3ms` alongside Biblical Aramaic Peal Yiqtol 3ms (`yiqtol`) on `arPos 19` («يَشَاءُ», `H6634@w21`) with explicit discrepancy note.
          - **Unseen Holdout Measurement**: Added read-only holdout audit script [`scripts/audit_unseen_holdout_sample.cjs`](scripts/audit_unseen_holdout_sample.cjs) measuring untouched OT Hebrew, OT Aramaic, and NT Greek verses directly against OSHB XML and SBLGNT MorphGNT.
          - **Benchmark Status**: **311 / 311 correct (100.00%)**, **0 errors**, **0 undecided**, **56/56 negative gates passing**.
          EOF
          
          sed -i "s/__APK_HASH__/$APK_HASH/g" release_notes.md
          sed -i "s/__DB_HASH__/$DB_HASH/g" release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arabic-bible-study-${{ env.APP_RELEASE_TAG }}
          path: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
            release_notes.md
            scratch/runtime_clean_and_upgrade_evidence_v372.json

      - name: Check if Release Tag Already Exists
        id: check_release
        run: |
          if git ls-remote --tags origin "refs/tags/${{ env.APP_RELEASE_TAG }}" | grep -q "${{ env.APP_RELEASE_TAG }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release tag ${{ env.APP_RELEASE_TAG }} already exists on remote; preserving published release binary."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) && steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.APP_RELEASE_TAG }}"
          target_commitish: "${{ github.sha }}"
          name: "Arabic Bible Study ${{ env.APP_RELEASE_TAG }}"
          body_path: release_notes.md
          files: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
