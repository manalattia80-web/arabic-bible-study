name: Build Android APK

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      - name: Configure Flutter Android Project
        working-directory: ./mobile
        run: |
          rm -f test/widget_test.dart
          node ../scripts/patch_gradle.cjs

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Generate App Icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons

      - name: Install SQLite3 for Linux Runner
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Run Rigorous Scientific & Database Quality Gate
        run: node scripts/automated_database_audit.cjs

      - name: Run 20-Verse Canonical Manifest Quality Gate
        run: node scripts/audit_20_verses_311_units.cjs

      - name: Run Negative Quality Gate Suite (Forbidden States CI Check)
        run: node scripts/test_negative_rules.cjs

      - name: Analyze Dart Code (Fail on Fatal Errors)
        working-directory: ./mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter Unit Tests (WordMapping & Models Invariant)
        working-directory: ./mobile
        run: flutter test

      - name: Extract Canonical App Version from pubspec.yaml
        run: |
          RAW_VER=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VER" | cut -d'+' -f2)
          echo "APP_VER_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "APP_VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "APP_RELEASE_TAG=v$VER_NAME" >> $GITHUB_ENV
          echo "Canonical Version: $VER_NAME, Build: $VER_CODE, Tag: v$VER_NAME"

      - name: Build APK
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}
        
      - name: Find and Copy APK
        working-directory: ./mobile
        run: |
          APK_PATH=$(find build -name "*.apk" | grep release | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../arabic-bible-study-app.apk

      - name: Build App Bundle (AAB for Google Play Store)
        working-directory: ./mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}

      - name: Find and Copy AAB
        working-directory: ./mobile
        run: |
          AAB_PATH=$(find build -name "*.aab" | grep release | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -name "*.aab" | head -n 1)
          fi
          echo "Found AAB at: $AAB_PATH"
          cp "$AAB_PATH" ../play-store-bundle.aab

      - name: Verify Release Commit and Tag Matching
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Verified commit SHA: $CURRENT_SHA"
          echo "GitHub context SHA: ${{ github.sha }}"
          if [ "$CURRENT_SHA" != "${{ github.sha }}" ]; then
            echo "ERROR: HEAD commit ($CURRENT_SHA) does not match workflow SHA (${{ github.sha }})"
            exit 1
          fi

      - name: Compute SHA-256 Hashes and Generate Release Notes
        run: |
          APK_HASH=$(sha256sum arabic-bible-study-app.apk | awk '{print $1}')
          DB_HASH=$(sha256sum mobile/assets/bible_study.db | awk '{print $1}')
          echo "$APK_HASH" > apk_sha256.txt
          echo "$DB_HASH" > db_sha256.txt
          
          cat << 'EOF' > release_notes.md
          # Arabic Bible Study ${{ env.APP_RELEASE_TAG }}

          ## 🛡️ Build & Cryptographic Verification
          - **Release Tag**: `${{ env.APP_RELEASE_TAG }}`
          - **Version**: `${{ env.APP_VER_NAME }}` (Build `${{ env.APP_VER_CODE }}`)
          - **Commit SHA**: `${{ github.sha }}`
          - **APK SHA-256**: `__APK_HASH__`
          - **SQLite DB SHA-256**: `__DB_HASH__`

          ## 🚀 Database Upgrade Architecture & Data Protection (v1.0.365)
          - **Dynamic Upgrade Migration**: Bumped `targetDbVersion = 365` in `DatabaseService` with atomic temp-file assembly, pre-registration SQLite integrity check, and safe cleanup of legacy database binaries.
          - **Zero Data Loss Guarantee**: All user preferences, theme modes, font sizes, reading history, and bookmarks stored in `SharedPreferences` remain 100% intact upon upgrade.
          - **Batch 3 Canonical Repairs (Joshua 1:9) & OSHB Cantillation Harmonization**:
            - **Joshua 1:9 Word-Order Alignment**: Aligned Arabic SVO order ("الرَّبَّ إِلهَكَ مَعَكَ حَيْثُمَا") with Hebrew fronted predicate (`עִמְּךָ יְהוָה אֱלֹהֶיךָ בְּכֹל אֲשֶׁר תֵּלֵךְ`):
              - "الرَّبَّ" (pos 10): aligned from w10 to w11 (`יְהוָ֣ה`, H3068, HNp, locator `OSHB:B6.C1.V9.w11`).
              - "إِلهَكَ" (pos 11): aligned from w11 to w12 with authentic OSHB cantillation `אֱלֹהֶ֔יךָ` (zaqef qaton U+0594, H430, HNcmpc/Sp2ms, locator `OSHB:B6.C1.V9.w12`).
              - "مَعَكَ" (pos 12): aligned from w12 to w10 (`עִמְּךָ֙`, H5973, HR/Sp2ms, locator `OSHB:B6.C1.V9.w10`).
              - "حَيْثُمَا" (pos 13): multi-component alignment with primary component at w14 (`אֲשֶׁ֥ר`, H834, HTr, locator `OSHB:B6.C1.V9.w14`) and secondary component at w13 (`בְּכֹ֖ל`, H3605, HR/Ncmsa).
            - **Canonical Manifest v365**: 311 units: 244 correct (78.46%), 67 errors, 0 undecided.
          - **Negative Quality Gates 19, 20, 21 & Production CI**:
            - **Gate 19**: Rejection of Joshua 1:9 "الرَّبَّ" locator mutation from w11 back to w10.
            - **Gate 20**: Rejection of deleting secondary component w13 (`בְּכֹ֖ל`) from "حَيْثُمَا" in Joshua 1:9.
            - **Gate 21**: Rejection of reverting Joshua 1:9 "إِلهَكَ" from `אֱלֹהֶ֔יךָ` (zaqef qaton) to `אֱלֹהֶ֑יךָ` (etnachta).
            - **Direct OSHB Comparison**: Direct XML surface verification on OSHB tokens in production quality gates.
            - **Comprehensive Loci**: 49 verified direct source & morphology loci in Test 11, 16 dedicated component boundaries in Test 13.
          EOF
          
          sed -i "s/__APK_HASH__/$APK_HASH/g" release_notes.md
          sed -i "s/__DB_HASH__/$DB_HASH/g" release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arabic-bible-study-${{ env.APP_RELEASE_TAG }}
          path: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
            release_notes.md

      - name: Create Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.APP_RELEASE_TAG }}"
          target_commitish: "${{ github.sha }}"
          name: "Arabic Bible Study ${{ env.APP_RELEASE_TAG }}"
          body_path: release_notes.md
          files: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
