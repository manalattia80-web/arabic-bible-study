name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Initialize Flutter Project
        working-directory: ./mobile
        run: echo "Using checked-in android folder"

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Build APK
        working-directory: ./mobile
        run: |
          if ! flutter build apk --release > build_log.txt 2>&1; then
            cat build_log.txt
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            cp build_log.txt ../build_log.txt
            cd ..
            git add build_log.txt
            git commit -m "Upload build failure log"
            git push
            exit 1
          fi
        
      - name: Find and Move APK
        working-directory: ./mobile
        run: |
          APK_PATH=$(find build -name "*.apk" | grep release | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../arabic-bible-study-app.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Arabic Bible Study v1.0.${{ github.run_number }}"
          files: arabic-bible-study-app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
