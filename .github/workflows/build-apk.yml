name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Initialize Flutter Project
        working-directory: ./mobile
        run: flutter create . --platforms android,ios

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Generate App Icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons
        
      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release
        
      - name: Upload APK to bashupload
        working-directory: ./mobile
        run: |
          apk_path=$(find build/app/outputs/flutter-apk -name '*release*.apk' | head -n 1)
          echo "Uploading $apk_path..."
          curl -H "Max-Days: 1" -F "file=@$apk_path" https://bashupload.com/arabic-bible-study.apk
