name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      - name: Initialize Flutter Android Project
        working-directory: ./mobile
        run: |
          flutter create . --platforms android
          rm -f test/widget_test.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml || true
          node ../scripts/patch_gradle.cjs

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Generate App Icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        working-directory: ./mobile
        run: |
          export GRADLE_OPTS="-Dkotlin.compiler.languageVersion=1.8 -Dkotlin.compiler.apiVersion=1.8"
          export JAVA_TOOL_OPTIONS="-Dkotlin.compiler.languageVersion=1.8 -Dkotlin.compiler.apiVersion=1.8"
          if ! flutter build apk --release --no-tree-shake-icons > build_log.txt 2>&1; then
            cat build_log.txt
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            cp build_log.txt ../build_log.txt
            cd ..
            git add build_log.txt
            git commit -m "Upload build failure log" || true
            git push || true
            exit 1
          fi
        
      - name: Find, Commit and Publish Direct Download APK
        working-directory: ./mobile
        run: |
          APK_PATH=$(find build -name "*.apk" | grep release | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          ls -la "$APK_PATH"
          cp "$APK_PATH" ../arabic-bible-study-app.apk
          cd ..
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add arabic-bible-study-app.apk
          git commit -m "Auto-publish compiled APK build v1.0.${{ github.run_number }}" || true
          git push || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabic-bible-study-app-v1.0.${{ github.run_number }}
          path: arabic-bible-study-app.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Arabic Bible Study v1.0.${{ github.run_number }}"
          files: arabic-bible-study-app.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
