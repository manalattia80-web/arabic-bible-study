name: Build Android APK

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      - name: Configure Flutter Android Project
        working-directory: ./mobile
        run: |
          rm -f test/widget_test.dart
          node ../scripts/patch_gradle.cjs

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Generate App Icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons

      - name: Install SQLite3 for Linux Runner
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Run Rigorous Scientific & Database Quality Gate
        run: node scripts/automated_database_audit.cjs

      - name: Run 20-Verse Canonical Manifest Quality Gate
        run: node scripts/audit_20_verses_311_units.cjs

      - name: Run Negative Quality Gate Suite (Forbidden States CI Check)
        run: node scripts/test_negative_rules.cjs

      - name: Analyze Dart Code (Fail on Fatal Errors)
        working-directory: ./mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter Unit Tests (WordMapping & Models Invariant)
        working-directory: ./mobile
        run: flutter test

      - name: Extract Canonical App Version from pubspec.yaml
        run: |
          RAW_VER=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VER" | cut -d'+' -f2)
          echo "APP_VER_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "APP_VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "APP_RELEASE_TAG=v$VER_NAME" >> $GITHUB_ENV
          echo "Canonical Version: $VER_NAME, Build: $VER_CODE, Tag: v$VER_NAME"

      - name: Build APK
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}
        
      - name: Find and Copy APK
        working-directory: ./mobile
        run: |
          APK_PATH=$(find build -name "*.apk" | grep release | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../arabic-bible-study-app.apk

      - name: Build App Bundle (AAB for Google Play Store)
        working-directory: ./mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}

      - name: Find and Copy AAB
        working-directory: ./mobile
        run: |
          AAB_PATH=$(find build -name "*.aab" | grep release | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -name "*.aab" | head -n 1)
          fi
          echo "Found AAB at: $AAB_PATH"
          cp "$AAB_PATH" ../play-store-bundle.aab

      - name: Verify Release Commit and Tag Matching
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Verified commit SHA: $CURRENT_SHA"
          echo "GitHub context SHA: ${{ github.sha }}"
          if [ "$CURRENT_SHA" != "${{ github.sha }}" ]; then
            echo "ERROR: HEAD commit ($CURRENT_SHA) does not match workflow SHA (${{ github.sha }})"
            exit 1
          fi

      - name: Compute SHA-256 Hashes and Generate Release Notes
        run: |
          APK_HASH=$(sha256sum arabic-bible-study-app.apk | awk '{print $1}')
          DB_HASH=$(sha256sum mobile/assets/bible_study.db | awk '{print $1}')
          echo "$APK_HASH" > apk_sha256.txt
          echo "$DB_HASH" > db_sha256.txt
          
          cat << 'EOF' > release_notes.md
          # Arabic Bible Study ${{ env.APP_RELEASE_TAG }}

          ## 🛡️ Build & Cryptographic Verification
          - **Release Tag**: `${{ env.APP_RELEASE_TAG }}`
          - **Version**: `${{ env.APP_VER_NAME }}` (Build `${{ env.APP_VER_CODE }}`)
          - **Commit SHA**: `${{ github.sha }}`
          - **APK SHA-256**: `__APK_HASH__`
          - **SQLite DB SHA-256**: `__DB_HASH__`

          ## 🚀 Database Upgrade Architecture & Data Protection (v1.0.367)
          - **Dynamic Upgrade Migration**: Bumped `targetDbVersion = 367` in `DatabaseService` with atomic temp-file assembly, pre-registration SQLite integrity check, and safe cleanup of legacy database binaries.
          - **Zero Data Loss Guarantee**: All user preferences, theme modes, font sizes, reading history, and bookmarks stored in `SharedPreferences` remain 100% intact upon upgrade.
          - **Philippians 4:6 & Luke 15:20 Canonical Alignment**:
            - **Philippians 4:6 (all 11 Greek sample errors resolved)**:
              - "بِشَيْءٍ" (pos 3): `μηδὲν` (G3367, A- ----ASN-, locator `SBLGNT:B50.C4.V6.w1`), shared with "لاَ".
              - "بَلْ" (pos 4): `ἀλλ’` (G235, C- --------, locator `SBLGNT:B50.C4.V6.w3`).
              - "فِي" (pos 5): `ἐν` (G1722, P- --------, locator `SBLGNT:B50.C4.V6.w4`).
              - "كُلِّ" (pos 6): `παντὶ` (G3956, A- ----DSN-, locator `SBLGNT:B50.C4.V6.w5`), shared with "شَيْءٍ" (pos 7).
              - "بِالصَّلاَةِ" (pos 8): `προσευχῇ` (G4335, N- ----DSF-, locator `SBLGNT:B50.C4.V6.w7`).
              - "وَالدُّعَاءِ" (pos 9): Primary `δεήσει` (G1162, N- ----DSF-, w10), Secondary `καὶ` (G2532, C- --------, w8).
              - "مَعَ" (pos 10): `μετ’` (G3326, P- --------, locator `SBLGNT:B50.C4.V6.w11`), surface strictly `μετ’`, lexicon entry `μετά`.
              - "الشُّكْرِ" (pos 11): `εὐχαριστίας` (G2169, N- ----GSF-, locator `SBLGNT:B50.C4.V6.w12`).
              - "طِلْبَاتُكُمْ" (pos 13): Primary `αἰτήματα` (G155, N- ----NPN-, w14), Secondary `ὑμῶν` (G4771, RP ----GP--, w15).
              - "لَدَى" (pos 14): `πρὸς` (G4314, P- --------, locator `SBLGNT:B50.C4.V6.w17`).
              - "اللهِ" (pos 15): `θεόν` (G2316, N- ----ASM-, locator `SBLGNT:B50.C4.V6.w19`).
            - **Luke 15:20**:
              - "كَانَ" (pos 6): source fields updated to `syntactic_ar`, removing false morphgnt badge, locator `AR_IMPLIED:B42.C15.V20.w6`.
              - "بَعِيدًا" (pos 9): Primary `μακρὰν` (G3112, w11), Secondary `ἀπέχοντος` (G568, w12, `morphgnt_sblgnt`).
            - **Canonical Manifest v367**: 311 units: 261 correct (83.92%), 50 errors (Hebrew/Aramaic only, 0 Greek errors), 0 undecided.
          - **Negative Quality Gates 25, 26, 27, 28, 29 & Production CI**:
            - **Gate 25**: Rejection of reverting Phil 4:6 pos 10 ("مَعَ") locator from w11 back to w10.
            - **Gate 26**: Rejection of reverting Phil 4:6 pos 3 ("بِشَيْءٍ") locator from w1 back to w3.
            - **Gate 27**: Rejection of false MorphGNT badge on Luke 15:20 pos 6 ("كَانَ").
            - **Gate 28**: Rejection of deleting G568 (`ἀπέχοντος`) secondary component from Luke 15:20 pos 9 ("بَعِيدًا").
            - **Gate 29**: Rejection of reverting Phil 4:6 pos 10 ("مَعَ") surface from `μετ’` back to `μετά`.
            - **Comprehensive Loci**: 60 verified direct source & morphology loci in Test 11, 26 dedicated component boundaries in Test 13.
          EOF
          
          sed -i "s/__APK_HASH__/$APK_HASH/g" release_notes.md
          sed -i "s/__DB_HASH__/$DB_HASH/g" release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arabic-bible-study-${{ env.APP_RELEASE_TAG }}
          path: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
            release_notes.md

      - name: Create Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.APP_RELEASE_TAG }}"
          target_commitish: "${{ github.sha }}"
          name: "Arabic Bible Study ${{ env.APP_RELEASE_TAG }}"
          body_path: release_notes.md
          files: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
