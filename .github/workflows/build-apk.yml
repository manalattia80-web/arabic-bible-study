name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      - name: Configure Flutter Android Project
        working-directory: ./mobile
        run: |
          rm -f test/widget_test.dart
          node ../scripts/patch_gradle.cjs

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Generate App Icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons

      - name: Install SQLite3 for Linux Runner
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Run Rigorous Scientific & Database Quality Gate
        run: node scripts/automated_database_audit.cjs

      - name: Analyze Dart Code (Fail on Fatal Errors)
        working-directory: ./mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}
        
      - name: Find and Copy APK
        working-directory: ./mobile
        run: |
          APK_PATH=$(find build -name "*.apk" | grep release | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../arabic-bible-study-app.apk

      - name: Build App Bundle (AAB for Google Play Store)
        working-directory: ./mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}

      - name: Find and Copy AAB
        working-directory: ./mobile
        run: |
          AAB_PATH=$(find build -name "*.aab" | grep release | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -name "*.aab" | head -n 1)
          fi
          echo "Found AAB at: $AAB_PATH"
          cp "$AAB_PATH" ../play-store-bundle.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arabic-bible-study-v1.0.${{ github.run_number }}
          path: |
            arabic-bible-study-app.apk
            play-store-bundle.aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Arabic Bible Study v1.0.${{ github.run_number }}"
          files: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
