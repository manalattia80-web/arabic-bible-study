name: Build Android APK

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      - name: Configure Flutter Android Project
        working-directory: ./mobile
        run: |
          rm -f test/widget_test.dart
          node ../scripts/patch_gradle.cjs

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Generate App Icons
        working-directory: ./mobile
        run: dart run flutter_launcher_icons

      - name: Install SQLite3 for Linux Runner
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Reassemble SQLite Database from Chunk Parts
        run: node scripts/assemble_db.cjs

      - name: Verify Exact Database Chunks and App Alignment
        run: node scripts/verify_db_chunks_exact.cjs

      - name: Run Rigorous Scientific & Database Quality Gate
        run: node scripts/automated_database_audit.cjs

      - name: Run 20-Verse Canonical Manifest Quality Gate
        run: node scripts/audit_20_verses_311_units.cjs

      - name: Run Negative Quality Gate Suite (Forbidden States CI Check)
        run: node scripts/test_negative_rules.cjs

      - name: Run Strict Locator, TR Robinson, Batch 1 & 2A/2B/2C/2D/2E/2F/2G/2H/2I/2J/2K/2L/2M/2N/2O, Round 1 Holdout Zero-Alert Gate, & Live-Regenerated Alignment Engine Gates
        run: |
          node scripts/test_strict_locator_gates.cjs
          node scripts/test_tr_robinson_and_context_gates.cjs
          node scripts/test_round2_batch1_gates.cjs
          node scripts/test_round2_batch2a_gates.cjs
          node scripts/test_round2_batch2b_eph2_10_gates.cjs
          node scripts/test_round2_batch2c_1thess5_18_gates.cjs
          node scripts/test_round2_batch2d_rom5_8_gates.cjs
          node scripts/test_round2_batch2e_lk6_31_gates.cjs
          node scripts/test_round2_batch2f_phil2_5_gates.cjs
          node scripts/test_round2_batch2g_gal2_20_gates.cjs
          node scripts/test_round2_batch2h_1kgs19_12_gates.cjs
          node scripts/test_round2_batch2i_ezra4_24_gates.cjs
          node scripts/test_round2_batch2j_isa41_10_gates.cjs
          node scripts/test_round2_batch2k_ruth2_12_gates.cjs
          node scripts/test_round2_batch2l_mic7_18_gates.cjs
          node scripts/test_round2_batch2m_2chr7_14_gates.cjs
          node scripts/test_round2_batch2n_ezra5_11_gates.cjs
          node scripts/test_round2_batch2o_dan6_22_gates.cjs
          node scripts/test_round2_batch2p_dan7_13_gates.cjs
          node scripts/test_category_a_converter_and_gates.cjs
          node scripts/test_round3_batch3a_lev17_5_gates.cjs
          node scripts/test_round3_batch3b_prov28_9_gates.cjs
          node scripts/test_round3_batch3c_isa62_5_gates.cjs
          node scripts/test_round3_batch3d_dan10_13_gates.cjs
          node scripts/test_round3_batch3e_zech12_12_gates.cjs
          node scripts/test_round3_batch3f_ezra5_10_gates.cjs
          node scripts/test_round3_batch3g_ezra6_10_gates.cjs
          node scripts/test_round3_batch3h_dan5_2_gates.cjs
          node scripts/test_round3_batch3i_dan7_26_gates.cjs
          node scripts/test_round3_batch3j_mark3_11_gates.cjs
          node scripts/test_round3_batch3k_luke18_42_gates.cjs
          node scripts/test_round3_batch3l_rom16_16_gates.cjs
          node scripts/test_round3_batch3m_gal4_6_gates.cjs
          node scripts/test_round3_batch3n_eph1_21_gates.cjs
          node scripts/test_round3_batch3o_1pet4_11_gates.cjs
          node scripts/test_round1_holdout_gate.cjs
          node scripts/audit_unseen_holdout_sample.cjs --manifest scripts/unseen_holdout_15_verses_manifest.json --fail-on-alerts --out /tmp/ci_round1_audit.json
          node scripts/audit_unseen_holdout_sample.cjs --manifest scripts/unseen_holdout_round2_15_verses_manifest.json --fail-on-alerts --out /tmp/ci_round2_audit.json
          node scripts/alignment_suggestion_engine.cjs --manifest scripts/unseen_holdout_round2_15_verses_manifest.json --audit-report /tmp/ci_round2_audit.json --out /tmp/ci_round2_proposals.json
          node scripts/test_alignment_engine_gates.cjs --proposals /tmp/ci_round2_proposals.json --audit /tmp/ci_round2_audit.json
          node scripts/test_general_repair_engine_gates.cjs

      - name: Analyze Dart Code (Fail on Fatal Errors)
        working-directory: ./mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter Unit Tests (WordMapping & Models Invariant)
        working-directory: ./mobile
        run: flutter test

      - name: Run Clean Install & Upgrade Runtime Verification Suite
        run: node scripts/verify_runtime_clean_and_upgrade.cjs

      - name: Extract Canonical App Version from pubspec.yaml
        run: |
          RAW_VER=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VER" | cut -d'+' -f2)
          echo "APP_VER_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "APP_VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "APP_RELEASE_TAG=v$VER_NAME" >> $GITHUB_ENV
          echo "Canonical Version: $VER_NAME, Build: $VER_CODE, Tag: v$VER_NAME"

      - name: Build APK
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}
        
      - name: Find and Copy APK
        working-directory: ./mobile
        run: |
          APK_PATH=$(find build -name "*.apk" | grep release | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ../arabic-bible-study-app.apk

      - name: Verify Built APK Chunks and Asset Integrity (Post-Build Gate)
        run: node scripts/verify_apk_asset_integrity.cjs arabic-bible-study-app.apk

      - name: Verify APK Signature (apksigner), Alignment (zipalign), and Badging (aapt2)
        run: |
          BT_DIR=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools: $BT_DIR"
          "$BT_DIR/apksigner" verify --verbose --print-certs arabic-bible-study-app.apk
          "$BT_DIR/zipalign" -c 4 arabic-bible-study-app.apk
          echo "zipalign 4-byte check: OK"
          "$BT_DIR/aapt2" dump badging arabic-bible-study-app.apk | head -n 25

      - name: Build App Bundle (AAB for Google Play Store)
        working-directory: ./mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name=${{ env.APP_VER_NAME }} --build-number=${{ env.APP_VER_CODE }} --dart-define=APP_BUILD_NUMBER=${{ env.APP_VER_CODE }}

      - name: Find and Copy AAB
        working-directory: ./mobile
        run: |
          AAB_PATH=$(find build -name "*.aab" | grep release | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find . -name "*.aab" | head -n 1)
          fi
          echo "Found AAB at: $AAB_PATH"
          cp "$AAB_PATH" ../play-store-bundle.aab

      - name: Verify Release Commit and Tag Matching
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Verified commit SHA: $CURRENT_SHA"
          echo "GitHub context SHA: ${{ github.sha }}"
          if [ "$CURRENT_SHA" != "${{ github.sha }}" ]; then
            echo "ERROR: HEAD commit ($CURRENT_SHA) does not match workflow SHA (${{ github.sha }})"
            exit 1
          fi

      - name: Compute SHA-256 Hashes and Generate Release Notes
        run: |
          APK_HASH=$(sha256sum arabic-bible-study-app.apk | awk '{print $1}')
          DB_HASH=$(sha256sum mobile/assets/bible_study.db | awk '{print $1}')
          echo "$APK_HASH" > apk_sha256.txt
          echo "$DB_HASH" > db_sha256.txt
          
          cat << 'EOF' > release_notes.md
          # Arabic Bible Study ${{ env.APP_RELEASE_TAG }}

          ## 🛡️ Build & Cryptographic Verification
          - **Release Tag**: `${{ env.APP_RELEASE_TAG }}`
          - **Version**: `${{ env.APP_VER_NAME }}` (Build `${{ env.APP_VER_CODE }}`)
          - **Commit SHA**: `${{ github.sha }}`
          - **APK SHA-256**: `__APK_HASH__`
          - **SQLite DB SHA-256**: `__DB_HASH__`

          ## 🧪 Experimental Candidate: Whole-Verse General Repair Engine v1.5 (`${{ env.APP_RELEASE_TAG }}` / `targetDbVersion = ${{ env.APP_VER_CODE }}`)
          > **Pre-Release / Experimental Candidate Notice**: This build is an experimental candidate intended for on-device clean-install and upgrade testing (`v381 → v${{ env.APP_VER_CODE }}`). Database is vacuumed to 70 parts (~365 MB) and cryptographically verified via `apksigner verify` + `zipalign -c 4`. It demonstrates verified automated improvements with zero detected regressions, and **does not represent a certification of complete linguistic accuracy across all 434,351 records**.

          - **General Repair Engine `v1.5` Promotion (incremental on top of `v1.3` / `v381`)**: Applied `6,427` additional high-confidence repairs (`5,149` `RULE_G4_BRACKETED_DUPLICATE_BIJECTION`, `1,237` newly unlocked `RULE_G1`, `24` `RULE_G3`, `12` `RULE_G1B`, `5` `RULE_G2`) across all 66 books (`434,351` exact denominator).
          - **Hardened `v1.5` Soundness Guards**: Atomic G4 group integrity (zero partial group acceptance), surviving non-G4 anchor verification inside the fixed-point loop, exclusion of standalone Greek prepositions (`P-`), bare pronouns, and definite articles (`RA`) from `G4`, verified compound-preposition head preservation, zero `multiple_primary_components`, and bitwise-immutable Protected Adjudicated Registry (`92` verses / `1,477` rows / `1,622` components).
          - **Full-DB 4-Axis Impact (`v381 → v${{ env.APP_VER_CODE }}`, `434,351` records)**:
            - All 4 axes passing: `174,772 (40.24%) → 177,699 (40.91%)` (`+2,927` records, `+0.67 pp`, `0` regressions on any axis).
            - Whole verses 100% passing: `1,720 → 1,847` (`+127` verses).
          - **Verification & Non-Regression (`targetDbVersion = ${{ env.APP_VER_CODE }}`, `70` chunks)**:
            - `B20`: `311 / 311 (100.00%)` | `automated_database_audit.cjs`: `0` failures | `test_general_repair_engine_gates.cjs`: `29 / 29` passing.
            - `R1`: `253 / 253 (100.00%)` | `R2`: `255 / 255 (100.00%)` | `R3`: `233 / 234` (`234 / 234` with documented Dan 5:2 non-adjacent unit).
            - Known validation sets (`0` regressions on all 4 axes): `Round 4B` `79/197`, `Round 5` `77/247`, `Round 6` `80/229`.
          EOF
          
          sed -i "s/__APK_HASH__/$APK_HASH/g" release_notes.md
          sed -i "s/__DB_HASH__/$DB_HASH/g" release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arabic-bible-study-${{ env.APP_RELEASE_TAG }}
          path: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
            release_notes.md
            scratch/runtime_clean_and_upgrade_evidence_v372.json

      - name: Check if Release Tag Already Exists
        id: check_release
        run: |
          if git ls-remote --tags origin "refs/tags/${{ env.APP_RELEASE_TAG }}" | grep -q "${{ env.APP_RELEASE_TAG }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release tag ${{ env.APP_RELEASE_TAG }} already exists on remote; preserving published release binary."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) && steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.APP_RELEASE_TAG }}"
          target_commitish: "${{ github.sha }}"
          name: "Arabic Bible Study ${{ env.APP_RELEASE_TAG }}"
          body_path: release_notes.md
          files: |
            arabic-bible-study-app.apk
            play-store-bundle.aab
            apk_sha256.txt
            db_sha256.txt
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
